server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: continuum-control
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/continuum_control}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/continuum_control}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health